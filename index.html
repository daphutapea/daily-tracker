<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1524" media="(prefers-color-scheme: dark)" />
    <title>Daily Tracker</title>
    <script>
      // Apply the saved palette before first paint so the page never flashes the wrong one.
      // Mirrors resolve() in src/lib/theme.ts.
      try {
        var mode = localStorage.getItem('dt-theme') || 'system'
        var light = localStorage.getItem('dt-light') === 'white' ? 'white' : 'sage'
        var dark = localStorage.getItem('dt-dark') === 'charcoal' ? 'charcoal' : 'navy'
        var isDark = mode === 'dark' || (mode !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.palette = isDark ? dark : light
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
