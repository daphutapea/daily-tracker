<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1524" media="(prefers-color-scheme: dark)" />
    <title>Daily Tracker</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      try {
        var t = localStorage.getItem('dt-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
